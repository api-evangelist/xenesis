aid: xenesis
name: Xenesis
description: 'Xenesis, Inc. is an optical satellite communications company founded
  in 2017 by Mark LaPenna and headquartered in Lisle, Illinois. It builds the Xen-Hub,
  a free-space optical (laser) communications terminal enabled by a technology transfer
  from NASA''s Jet Propulsion Laboratory and rated at greater than 10 Gbps, and plans
  Intercessor, a space-to-ground optical mesh network intended to backhaul high-bandwidth
  data with lower latency and higher capacity than radio-frequency or terrestrial
  fiber links. The company has taken Space Development Agency optical-terminal awards
  (Phase 1 in August 2022, a Phase 2 follow-on in December 2023) built to the SDA
  OCT v3.1 and v4.0 standards, signed a payload agreement with Airbus for a Bartolomeo
  demonstration slot on the International Space Station, and holds a $1.2M agreement
  with Georgia Tech for satellite optical communications work. Xenesis is a space
  hardware and telecommunications-infrastructure company, not a software vendor: as
  of this profiling pass it publishes no public API, developer portal, SDK, or
  machine-readable contract of any kind, and its own website is currently returning
  an HTTP 401 site-wide password lock.'
